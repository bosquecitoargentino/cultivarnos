<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cultivarnos</title>
<meta name="description" content="Tu cuaderno de cultivo digital" />
<meta name="theme-color" content="#3f6b45" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cultivarnos" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <img src="assets/logo-cultivarnos.svg" alt="Cultivarnos" class="topbar-logo" width="26" height="26" />
  </div>
  <button id="btn-menu" class="icon-btn" aria-label="Más opciones" title="Más opciones"></button>
</header>

<div id="menu-panel" class="menu-panel hidden">
  <button id="btn-export" class="menu-item">Exportar respaldo</button>
  <label class="menu-item" for="input-import">Importar respaldo</label>
  <input type="file" id="input-import" accept="application/json" hidden />
  <button id="btn-banco" class="menu-item"></button>
  <button id="btn-configuracion" class="menu-item">Configuración</button>
</div>

<main id="app" class="app-view"></main>

<nav id="bottom-nav" class="bottom-nav">
  <a href="#/inicio" class="nav-item" data-nav="inicio">
    <span class="nav-icon"></span>
    <span class="nav-label">Inicio</span>
  </a>
  <a href="#/cultivos" class="nav-item" data-nav="cultivos">
    <span class="nav-icon"></span>
    <span class="nav-label">Mis cultivos</span>
  </a>
  <a href="#/biblioteca" class="nav-item" data-nav="biblioteca">
    <span class="nav-icon"></span>
    <span class="nav-label">Biblioteca</span>
  </a>
  <button id="nav-registrar" type="button" class="nav-item nav-item-cta" data-nav="registrar">
    <span class="nav-icon"></span>
    <span class="nav-label">Registrar</span>
  </button>
</nav>

<div id="toast" class="toast hidden"></div>

<div id="update-banner" class="update-banner hidden">
  <span class="update-banner-texto">🌱 Nueva versión disponible</span>
  <div class="update-banner-botones">
    <button type="button" id="update-banner-btn" class="pill-btn">Actualizar ahora</button>
    <button type="button" id="update-banner-cerrar" class="update-banner-cerrar" aria-label="Cerrar">✕</button>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/data/cultivos-data.js"></script>
<script src="js/data/biblioteca-especies.js"></script>
<script src="js/motor-biblioteca.js"></script>
<script src="js/motor-banco.js"></script>
<script src="js/motor-estacional.js"></script>
<script src="js/data/preguntas-cultivos.js"></script>
<script src="js/motor-observacion.js"></script>
<script src="js/motor-siembra.js"></script>
<script src="js/motor-cosecha.js"></script>
<script src="js/motor-espacios.js"></script>
<script src="js/motor-resumen.js"></script>
<script src="js/motor-tarjeta.js"></script>
<script src="js/views/inicio.js"></script>
<script src="js/views/cultivos.js"></script>
<script src="js/views/nuevo.js"></script>
<script src="js/views/detalle.js"></script>
<script src="js/views/configuracion.js"></script>
<script src="js/views/calendario.js"></script>
<script src="js/views/biblioteca.js"></script>
<script src="js/views/ficha-especie.js"></script>
<script src="js/views/espacios.js"></script>
<script src="js/views/compartir.js"></script>
<script src="js/views/banco.js"></script>
<script src="js/views/banco-nuevo.js"></script>
<script src="js/views/banco-detalle.js"></script>
<script src="js/app.js"></script>
<script>
  // Pintar los íconos del sistema (js/icons.js) en los elementos "fijos"
  // del shell de la app — nav inferior, topbar y panel "···". Se hace acá
  // (no en el HTML estático) porque renderIcon() es una función JS; para
  // el resto de la app (vistas que se re-renderizan solas) cada vista
  // arma su propio innerHTML con renderIcon() adentro del template, sin
  // necesitar este paso aparte.
  document.getElementById('btn-menu').innerHTML = renderIcon('mas', { scale: 'lg' });
  document.getElementById('btn-banco').innerHTML = `${renderIcon('banco', { scale: 'sm' })} Banco`;
  document.querySelector('#bottom-nav [data-nav="inicio"] .nav-icon').innerHTML = renderIcon('inicio', { scale: 'lg' });
  document.querySelector('#bottom-nav [data-nav="cultivos"] .nav-icon').innerHTML = renderIcon('cultivos', { scale: 'lg' });
  document.querySelector('#bottom-nav [data-nav="biblioteca"] .nav-icon').innerHTML = renderIcon('biblioteca', { scale: 'lg' });
  document.querySelector('#nav-registrar .nav-icon').innerHTML = renderIcon('registrar', { scale: 'md' });

  // Menú de exportación / importación
  document.getElementById('btn-menu').addEventListener('click', () => {
    document.getElementById('menu-panel').classList.toggle('hidden');
  });

  document.getElementById('btn-export').addEventListener('click', async () => {
    document.getElementById('menu-panel').classList.add('hidden');
    try {
      await exportarRespaldo();
      showToast('Respaldo exportado');
    } catch (err) {
      console.error(err);
      showToast('Error al exportar');
    }
  });

  document.getElementById('input-import').addEventListener('change', async (e) => {
    document.getElementById('menu-panel').classList.add('hidden');
    const file = e.target.files[0];
    if (!file) return;
    try {
      // Orden obligatorio: leer + parsear + validar ANTES de preguntar si
      // se reemplazan los datos. Si el archivo no es un respaldo válido,
      // nunca se llega a mostrar el diálogo de confirmación ni se toca
      // IndexedDB.
      const data = await leerRespaldoDesdeArchivo(file);
      const confirmMsg = 'Importar reemplazará todos los datos actuales por los del respaldo. ¿Continuar?';
      if (!window.confirm(confirmMsg)) { e.target.value = ''; return; }
      await DB.importAll(data, { replace: true });
      showToast('Datos importados');
      router();
    } catch (err) {
      console.error(err);
      showToast(err.message || 'Error al importar el archivo');
    } finally {
      e.target.value = '';
    }
  });

  document.getElementById('btn-banco').addEventListener('click', () => {
    document.getElementById('menu-panel').classList.add('hidden');
    navigate('#/banco');
  });

  document.getElementById('btn-configuracion').addEventListener('click', () => {
    document.getElementById('menu-panel').classList.add('hidden');
    navigate('#/configuracion');
  });

  document.addEventListener('click', (e) => {
    const panel = document.getElementById('menu-panel');
    const btn = document.getElementById('btn-menu');
    if (!panel.contains(e.target) && !btn.contains(e.target) && !panel.classList.contains('hidden')) {
      panel.classList.add('hidden');
    }
  });

  function showToast(msg, duration = 2200) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.remove('hidden');
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.classList.add('hidden'), 250);
    }, duration);
  }
  window.showToast = showToast;
</script>
</body>
</html>
